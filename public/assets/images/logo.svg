<svg viewBox="0 0 120 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-bg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A84FF"/>
      <stop offset="0.5" stop-color="#007AFF"/>
      <stop offset="1" stop-color="#5856D6"/>
    </linearGradient>
    <linearGradient id="logo-shine" x1="0" y1="0" x2="36" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.3"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="logo-shadow" x="-2" y="-1" width="40" height="40" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#007AFF" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Icon background -->
  <rect x="0" y="0" width="36" height="36" rx="10" fill="url(#logo-bg)" filter="url(#logo-shadow)"/>
  <rect x="0" y="0" width="36" height="18" rx="10" fill="url(#logo-shine)"/>
  
  <!-- Chain link icon -->
  <g transform="translate(7, 7)">
    <path d="M8 11a4.5 4.5 0 0 1 0-6.36l2-2a4.5 4.5 0 1 1 6.36 6.36l-1 1" 
          stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.95"/>
    <path d="M14 11a4.5 4.5 0 0 1 0 6.36l-2 2a4.5 4.5 0 1 1-6.36-6.36l1-1" 
          stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.95"/>
    <path d="M10 14l2-2" 
          stroke="white" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  </g>
  
  <!-- NYCK text -->
  <text x="44" y="25.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" 
        font-size="19" font-weight="800" letter-spacing="-0.02em" fill="#1d2129">
    NYCK
  </text>
</svg>
